[project]
name = "tomai-curriculum"
version = "2.0.0"
description = "Pipeline RAG éducatif - Programmes officiels Éduscol, 5ème"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TomAI Team" }]

dependencies = [
    "pydantic>=2.0",
    "mistralai>=1.5",
    "mistral-common[sentencepiece]>=1.5",
    "qdrant-client>=1.18",
    "chonkie[sentence]>=1.6",
    "pymupdf4llm>=0.0.21",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]
eval = [
    "langchain-mistralai>=0.2",
    "litellm>=1.85.0",
    "ragas>=0.4",
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schema", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
