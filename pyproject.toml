[project]
name = "tomai-curriculum"
version = "1.0.0"
description = "Dataset éducatif français pour TomAI - Programmes officiels Éduscol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TomAI Team" }]

dependencies = [
    "pydantic>=2.0",           # Validation schemas
    "jsonlines>=4.0",          # JSONL I/O
    "httpx>=0.27",             # API calls (Qdrant, embeddings)
    "rich>=13.0",              # CLI output
    "typer>=0.12",             # CLI framework
    "qdrant-client>=1.12",     # Qdrant vector DB
    "mistralai>=1.0",          # Mistral embeddings (migration from Gemini - Jan 2025)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",               # Linting
    "pytest>=8.0",             # Tests
]

[project.scripts]
curriculum = "scripts.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
