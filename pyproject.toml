[project]
name = "tomai-curriculum"
version = "2.0.0"
description = "Pipeline RAG éducatif - Programmes officiels Éduscol, 5ème"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TomAI Team" }]

dependencies = [
    "pydantic>=2.0",
    "mistralai>=1.5",
    "mistral-common[sentencepiece]>=1.5",
    "qdrant-client>=1.18",
    "chonkie[sentence]>=1.6",
    "pymupdf4llm>=0.0.21",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "mypy>=1.13",
]
eval = [
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schema", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# mypy : périmètre restreint à schema/ (bibliothèque partagée, API publique
# typée strictement). Les scripts CLI restent hors scope pour l'instant — ils
# parlent à des SDK non typés (chonkie, pymupdf4llm) et le coût de typage n'est
# pas justifié tant qu'ils ne sont pas importés ailleurs.
[tool.mypy]
files = ["schema"]
python_version = "3.11"
strict = true
# Les SDK externes (qdrant-client, mistralai, FlagEmbedding, sentence-
# transformers) n'exposent pas tous des stubs complets : on ignore les imports
# manquants plutôt que de polluer le code avec des `type: ignore`.
ignore_missing_imports = true
